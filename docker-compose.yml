version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc mb -p local/images || true"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/media_manager
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: images
      S3_SECURE: "false"
      ENVIRONMENT: development
      JWT_SECRET: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ALLOW_DEV_TOKENS: "true"
    depends_on:
      - postgres
      - redis
      - minio
      - minio-setup
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/media_manager
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: images
      S3_SECURE: "false"
      ENVIRONMENT: development
      JWT_SECRET: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ALLOW_DEV_TOKENS: "true"
    depends_on:
      - postgres
      - redis
      - minio
      - minio-setup

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - postgres

volumes:
  pgdata:
  minio-data:

