[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_any_generics = True
no_implicit_optional = True
check_untyped_defs = True
strict_equality = True
exclude = migrations/|alembic.ini

[mypy-boto3]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-celery]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-jose]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True


# Generated in the build (scripts/gen_spine_stubs.py): the gRPC plugin emits
# untyped code, and its .pyi is not strict (bare Mapping); callers still get
# the .pyi's message types.
[mypy-app.spine.media_v1.*]
ignore_errors = True
