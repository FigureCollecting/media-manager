line-length = 100
target-version = "py312"
src = ["app", "tests"]
# The media.v1 stubs are generated in the build (scripts/gen_spine_stubs.py).
extend-exclude = ["app/spine/media_v1/media_pb2*"]

# TCH (flake8-type-checking) is intentionally omitted: it moves imports into
# TYPE_CHECKING blocks, which breaks FastAPI/Pydantic runtime type resolution --
# Depends() signatures (Session, Settings, AuthCtx) must be importable at runtime.
[lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "ISC", "SIM"]
ignore = ["E501"]

[lint.flake8-bugbear]
# FastAPI Depends/Query/etc. in argument defaults are idiomatic and safe (not
# mutable defaults), so they are exempt from B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "fastapi.Security",
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

