name: Build and Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Generate media.v1 stubs from the pinned proto
        run: poetry run python scripts/gen_spine_stubs.py

      - name: Run ruff linter
        run: poetry run ruff check app/ tests/

      - name: Run ruff formatter check
        run: poetry run ruff format --check app/ tests/

      - name: Run mypy type check
        run: poetry run mypy app/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # A deadlock fails the job instead of running to GitHub's 6 h default (each
    # test is stopped first, at pytest-timeout's limit in pyproject.toml).
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Generate media.v1 stubs from the pinned proto
        run: poetry run python scripts/gen_spine_stubs.py

      - name: Run tests with coverage
        run: poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing
        env:
          TESTING: "true"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: media-manager
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: media-manager:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
