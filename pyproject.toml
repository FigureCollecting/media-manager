[tool.poetry]
name = "media-manager"
version = "0.1.0"
description = "A production-ready image microservice with FastAPI, Postgres, S3/MinIO, Celery, and search"
authors = []
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.112.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = ">=2.0.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
boto3 = "^1.34.0"
pillow = "^10.4.0"
pyvips = "^2.2.3"
ImageHash = "^4.3.1"
celery = "^5.4.0"
redis = "^5.0.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
scipy = "^1.18.1"
grpcio = "1.84.0"
protobuf = "7.36.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
moto = {version = "^5.0.0", extras = ["s3"]}
fakeredis = "^2.23.2"
mypy = "^1.10.0"
ruff = "^0.5.0"
types-requests = "^2.32.0.20240712"
types-redis = "^4.5.0.20240218"
types-Pillow = "^10.2.0.20240822"
coverage = "^7.6.0"
pytest-cov = "^7.0.0"
grpcio-tools = "1.84.0"
types-grpcio = "1.84.0.20260928"
types-protobuf = "7.35.1.20260906"

# Ruff config lives in ruff.toml, which takes precedence over any [tool.ruff]
# table here -- keep it in one place to avoid divergent, silently-ignored config.

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
plugins = []
exclude = ["migrations/", "alembic.ini"]

[tool.coverage.run]
# Generated in the build from the pinned proto (scripts/gen_spine_stubs.py).
omit = ["app/spine/media_v1/media_pb2*"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

